name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '24'

jobs:
  test:
    name: Rust tests and lints
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (native + wasm)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint core
        run: cargo clippy -p questionbank-core --all-targets -- -D warnings

      - name: Lint wasm shell
        run: cargo clippy -p questionbank-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Test core
        run: cargo test -p questionbank-core

  web:
    name: Web build (WASM)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build browser app
        env:
          # GitHub Project Pages URL: https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run web:build

      - name: Disable Jekyll
        run: touch frontend/dist/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 14

  desktop:
    name: Desktop build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            artifact: desktop-linux-x64
            binary: target/release/questionbank-desktop
            bundle: appimage
            bundle_ext: AppImage
          - name: Windows x64
            os: windows-latest
            artifact: desktop-windows-x64
            binary: target/release/questionbank-desktop.exe
            bundle: nsis
            bundle_ext: exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install Rust (native + wasm)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e 'const fs=require("fs");const f="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(f,"utf8"));c.version=process.env.GITHUB_REF_NAME.replace(/^v/,"");fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")'

      - name: Build desktop bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run build -- --bundles ${{ matrix.bundle }}

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.binary }}
            target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle_ext }}
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summarize deployment
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets

      - name: Create or update the release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Summarize release
        run: echo "Released ${{ steps.release.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
