[package]
name = "questionbank-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser (WebAssembly) shell for the question bank"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
questionbank-core = { path = "../core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = "1"
serde-wasm-bindgen = "0.6"
serde_json = "1"
js-sys = "0.3"
rexie = "0.6"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-bulk-memory-opt", "--enable-nontrapping-float-to-int"]
